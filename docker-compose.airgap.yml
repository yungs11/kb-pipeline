# 8.kb-pipeline/docker-compose.airgap.yml
# ─────────────────────────────────────────────────────────────────────────────
# 폐쇄망(air-gap) 전용 compose — RHEL + Podman(rootful) + podman-compose 용.
#
# base docker-compose.yml 과의 차이 (왜 별도 파일인가):
#   1) build: 전부 제거 → image: 태그만.   (오프라인에서 podman 이 빌드 시도 못 하게 원천 차단.
#      6개 앱 이미지는 온라인 Mac 에서 buildx amd64 로 미리 빌드→save→load 됨.)
#   2) docker-compose.override.yml 의 `!override` 커스텀 YAML 태그 제거 → 호스트 포트를
#      본문에 직접 인라인.  (podman-compose 는 `!override` 태그를 파싱하지 못함.)
#   3) 각 서비스에 restart: unless-stopped 추가 → podman-compose 가 depends_on 의
#      condition: service_healthy 를 '기다리지' 않아 생기는 기동 레이스를 자가치유.
#      (최종 정상성은 load-and-up.sh 의 health 폴링이 보증한다.)
#
# 이미지 태그 규약:
#   - 앱 6종(빌드): kbp-<svc>:airgap   ← build-bundle.sh 가 이 이름으로 태깅/save 한다.
#   - 인프라 3종(pull): 업스트림 원본 태그 그대로   ← load 후 로컬에 존재하므로 pull 안 함.
#
# 엔드포인트(온프렘 재설정 대상)는 전부 .env 에서 온다. 무엇을/어디서 바꾸는지는
# .env.airgap.example 최상단 블록 참고.
# ─────────────────────────────────────────────────────────────────────────────
name: kbp
networks: { kbp: {} }
volumes: { eq_pg_data: {}, minio_data: {} }

# facade 와 facade-worker 공용 env. 앵커로 묶지 않으면 두 블록에 리터럴을 복제해야 하고,
# 한쪽만 고치는 순간 조용히 어긋난다.
x-facade-env: &facade_env
  # 인트라스택 DNS (바꾸지 말 것)
  KBP_PARSE_SVC_URL: http://parse-svc:19001
  KBP_ADAPTIVE_CHUNK_URL: http://adaptive_chunk:18060
  KBP_EDGEQUAKE_URL: http://edgequake:8081
  # doc_guard — facade 가 게이트를 은닉한다(/gate/*). 소비자(kb)는 이 주소를 모른다.
  KBP_DOC_GUARD_URL: http://doc_guard:8000
  # 공유비밀(X-Facade-Key). **비어 있으면 게이트가 꺼진다**(dev 와 동일) — 폐쇄망은
  # facade 가 호스트 포트로 노출되므로 반드시 채운다. kb 스택의 KBP_FACADE_KEY 와
  # 같은 값이어야 적재·검색이 통과한다. 배포 전 검증은 verify-bundle.sh 가 막는다.
  KBP_FACADE_KEY: ${KBP_FACADE_KEY:-}
  # kb 가 남긴 `parse-staging/` 임시본 수거(D20). 잡 큐 GC 와 프리픽스도 판정도 다르다 —
  # 참조가 kb DB 에 있어 facade 는 나이로만 지운다. 0 이면 그 갈래 정지.
  #   preview  : 파싱 미리보기 세션(적재 누르기 전). 짧게.
  #   batch    : 배치 원본. 실패 항목 **재수행**이 이 객체를 다시 쓰므로 길게.
  KBP_STAGING_TTL_SECONDS: ${KBP_STAGING_TTL_SECONDS:-3600}
  KBP_STAGING_BATCH_TTL_SECONDS: ${KBP_STAGING_BATCH_TTL_SECONDS:-604800}
  KBP_PG_DSN: postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
  # ↓ 온프렘 LLM (.env: KBP_OPENAI_*)
  KBP_OPENAI_API_KEY: ${KBP_OPENAI_API_KEY}
  KBP_OPENAI_BASE_URL: ${KBP_OPENAI_BASE_URL}
  KBP_LLM_MODEL: ${KBP_LLM_MODEL}
  # 잡 staging + 큰 payload/result 오프로딩. 없으면 /parse·/ingest 접수가 전면 실패한다.
  # (parse-svc 블록에 이미 같은 값이 있다 — 페이지 이미지용.)
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-document-parser}
  MINIO_SECURE: "false"
  # 잡 큐 — 전부 ${VAR:-기본값} 형식이어야 한다. 기본값 없이 쓰면 미정의 시 빈 문자열이
  # 주입되어 코드 기본값이 아니라 빈 값으로 동작한다(KBP_FACADE_KEY 로 이미 겪은 함정).
  KBP_JOB_LIMIT_PARSE: ${KBP_JOB_LIMIT_PARSE:-4}
  KBP_JOB_LIMIT_CHUNK: ${KBP_JOB_LIMIT_CHUNK:-2}
  KBP_JOB_LIMIT_INSERT: ${KBP_JOB_LIMIT_INSERT:-2}
  # 커뮤니티 재빌드. 전역 단일 그래프라 1 이면 충분하다 — 같은 workspace 를 두 번
  # 빌드하면 뒤엣것이 앞엣것을 덮을 뿐이다.
  KBP_JOB_LIMIT_COMMUNITY: ${KBP_JOB_LIMIT_COMMUNITY:-1}
  KBP_JOB_LIMIT_PER_WORKSPACE: ${KBP_JOB_LIMIT_PER_WORKSPACE:-2}
  KBP_JOB_WORKER_CONCURRENCY: ${KBP_JOB_WORKER_CONCURRENCY:-4}
  KBP_JOB_MAX_WAITERS: ${KBP_JOB_MAX_WAITERS:-4}
  KBP_JOB_LEGACY_WAIT_SECONDS: ${KBP_JOB_LEGACY_WAIT_SECONDS:-3300}
  KBP_JOB_MAX_UPLOAD_BYTES: ${KBP_JOB_MAX_UPLOAD_BYTES:-52428800}
  KBP_JOB_MINIO_PREFIX: ${KBP_JOB_MINIO_PREFIX:-kbp-jobs}
  KBP_STAGING_PREFIX: ${KBP_STAGING_PREFIX:-parse-staging}
  # GC(D2) — TTL_HOURS=0 이면 TTL 삭제·고아 스윕이 **둘 다 정지**한다(비상 레버).
  KBP_JOB_TTL_HOURS: ${KBP_JOB_TTL_HOURS:-72}
  KBP_JOB_GC_INTERVAL_SECONDS: ${KBP_JOB_GC_INTERVAL_SECONDS:-3600}
  KBP_JOB_ORPHAN_SWEEP_INTERVAL_SECONDS: ${KBP_JOB_ORPHAN_SWEEP_INTERVAL_SECONDS:-21600}
  KBP_JOB_ORPHAN_SWEEP_BOOT_DELAY_SECONDS: ${KBP_JOB_ORPHAN_SWEEP_BOOT_DELAY_SECONDS:-600}
  KBP_JOB_ORPHAN_GRACE_SECONDS: ${KBP_JOB_ORPHAN_GRACE_SECONDS:-21600}

  # ── global 검색 (B) ──────────────────────────────────────────────────────
  # 커뮤니티 리포트 map N + reduce 1 의 **순차 LLM** 이라 요청 하나가 분 단위로 스레드를
  # 점유한다. 잡 큐의 상한은 잡 경로에만 적용되므로 이 동기 경로에는 별도 상한이 필요하다.
  # map 대상 수를 줄이려면 요청의 global_top_k(1~5 clamp)를 쓴다 — facade 의 top_k 와 다르다.
  KBP_GLOBAL_LLM_TIMEOUT: ${KBP_GLOBAL_LLM_TIMEOUT:-60}
  # **워커 4개를 합친 시스템 전역** 상한(DB 카운터 + advisory lock). 0 이면 사실상 비활성.
  KBP_GLOBAL_SEARCH_CONCURRENCY: ${KBP_GLOBAL_SEARCH_CONCURRENCY:-2}

  # ── 야간 커뮤니티 배치(A1) ────────────────────────────────────────────────
  # 커뮤니티 빌드를 적재 경로에서 떼어내 **밤 1회**로 모은다(주간 LLM 부하 회피 +
  # 진입점 단일화). 대가는 "커뮤니티가 최대 하루 뒤 반영"이다.
  # 야간 창을 판정할 시간대. **컨테이너 TZ 와 분리했다**(D33) — 한 변수가 "창 판정"과
  # "로그 시각 표기"를 겸하면, 로그를 UTC 로 맞추려 TZ=UTC 로 둘 때 창이 조용히 KST
  # 정오로 이동한다. 컨테이너는 UTC 로 두어 parse-svc 와 로그 시각축을 통일하고,
  # 창 판정만 이 값으로 한다. 미설정 기본값이 Asia/Seoul 이라 안 줘도 정확하다.
  KBP_COMMUNITY_TZ: ${KBP_COMMUNITY_TZ:-Asia/Seoul}
  # false 면 스레드를 아예 안 띄운다(파서 전용 배포·비상 정지).
  KBP_COMMUNITY_BUILD_ENABLED: ${KBP_COMMUNITY_BUILD_ENABLED:-true}
  KBP_COMMUNITY_BUILD_AT: ${KBP_COMMUNITY_BUILD_AT:-03:00}
  KBP_COMMUNITY_WINDOW_MINUTES: ${KBP_COMMUNITY_WINDOW_MINUTES:-120}
  # 이 시각 이후에는 남은 queued 를 취소한다(업무시간 침범 방지). 창보다 커야 의미가 있다.
  KBP_COMMUNITY_DEADLINE_MINUTES: ${KBP_COMMUNITY_DEADLINE_MINUTES:-420}
  KBP_COMMUNITY_MAX_PER_NIGHT: ${KBP_COMMUNITY_MAX_PER_NIGHT:-8}
  KBP_COMMUNITY_POLL_SECONDS: ${KBP_COMMUNITY_POLL_SECONDS:-60}
  # SIGKILL/OOM 으로 batch_runs 행이 'started' 로 굳었을 때 회수하기까지의 지연(분).
  KBP_COMMUNITY_STALE_RUN_MINUTES: ${KBP_COMMUNITY_STALE_RUN_MINUTES:-30}
  # 제출 루프 시간 예산(초). ensure_workspace 가 동기 HTTP 라 edgequake 가 hang 이면
  # 캡만큼 곱해져 틱 하나가 오래 막힌다.
  KBP_COMMUNITY_SUBMIT_BUDGET_SECONDS: ${KBP_COMMUNITY_SUBMIT_BUDGET_SECONDS:-600}
services:
  # ── 인프라 티어 (pull 이미지 — build-bundle.sh 가 로컬 태그를 부여해 save 한다) ──
  postgres:
    # **로컬 태그로 참조한다**(업스트림 digest 참조 아님). build-bundle.sh 는 재현성을 위해
    # digest 로 pull 한 뒤 이 태그를 붙여 save 한다(그쪽 PULLS 주석에 근거 전체).
    #  - digest 로 pull 하는 이유: :latest 드리프트 방지(실측 pg16.14 → pg18.4 로 바뀌며
    #    볼륨 마운트 규약이 깨져 postgres 가 아예 기동 불가였다).
    #  - 그런데 compose 가 digest 를 참조하면 **podman 배포가 깨진다**: docker save 한
    #    digest-only 이미지는 podman load 시 `<none>:<none>` 로 들어와 `image not known`
    #    (실측 2026-08-07, podman 5.8.2). docker 는 넘어가므로 docker 테스트로는 안 잡힌다.
    # 업스트림을 의도적으로 올릴 땐 build-bundle.sh 의 digest 를 갱신한다(여기 말고).
    image: kbp-postgres:airgap
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgequake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgequake_secret}
      POSTGRES_DB: edgequake
    # pg18+ 는 /var/lib/postgresql/data 직접 마운트를 거부한다(위 주석) — 부모 디렉터리에
    # 마운트하면 이미지가 자체적으로 버전별 서브디렉터리를 관리한다(pg16 이하도 호환).
    volumes: ["eq_pg_data:/var/lib/postgresql"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U edgequake"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kbp]

  minio:
    # 로컬 태그(위 postgres 주석과 같은 이유 + unqualified name 회피 — podman 은
    # `minio/minio` 를 unqualified-search-registries 로 해석하려 들어 폐쇄망에서
    # 재-pull 을 시도할 위험이 있다. 로컬 태그면 레지스트리 해석이 아예 없다).
    image: kbp-minio:airgap
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: ["minio_data:/data"]
    # 호스트 포트: override 의 승격값(9000/9001)을 인라인. 폐쇄망에서 이 포트가 이미
    # 점유돼 있으면 좌측(호스트) 숫자만 바꾼다 (예: "19010:9000").
    ports: ["3003:9001"]   # 외부노출: 호스트 3003 → minio 콘솔 9001(버킷관리 UI). S3 API(9000)는 내부 DNS(minio:9000)로만 사용 → 호스트 노출 불필요. 외부 S3 필요시 "<포트>:9000" 추가.
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [kbp]

  # ── 지식그래프/벡터 엔진 ────────────────────────────────────────────────────
  edgequake:
    image: kbp-edgequake:airgap
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
      EDGEQUAKE_CHUNKER: passthrough
      # LLM provider — 폐쇄망 실측(2026-08-07), 2단계로 발견:
      # 1) openrouter provider 는 from_env() 가 OPENROUTER_API_KEY/MODEL/SITE_* 만 읽고
      #    base_url 오버라이드가 전혀 없다(하드코딩 https://openrouter.ai) — 인터넷 없는
      #    폐쇄망에서 엔티티추출이 100% 실패(Network error).
      # 2) EDGEQUAKE_LLM_PROVIDER=openai + OPENAI_BASE_URL 로 바꿔도 여전히 실패 —
      #    safety_limits.rs 의 COMPAT-GUARD(is_model_provider_mismatch)가 "openai"
      #    provider 에 대해 모델명이 gpt-*/o1-*.. 패턴이 아니면(예: "qwen/...") "provider
      #    default"(gpt-4.1-nano, base_url 도 api.openai.com 으로 재구성)로 조용히
      #    바꿔버린다 — 기존에 겪은 COMPAT-GUARD 다운그레이드 버그(_workspace 기록)와
      #    동일 메커니즘. 이 가드는 openai/anthropic/gemini/xai/minimax 에만 걸리고
      #    openai-compatible/openrouter 는 대상이 아니다(코드 확인: match 문 `_ => false`).
      # → provider 를 openai-compatible 로 쓰고, 전용 env(OPENAI_COMPATIBLE_*, 코드:
      #   factory.rs create_openai_compatible_from_env)로 배선한다. 인터넷이 되는
      #   개발환경 등에서 openrouter 를 계속 쓰려면 EDGEQUAKE_LLM_PROVIDER=openrouter 로
      #   .env 에서 덮어쓴다.
      EDGEQUAKE_LLM_PROVIDER: ${EDGEQUAKE_LLM_PROVIDER:-openai-compatible}
      OPENAI_COMPATIBLE_BASE_URL: ${KBP_OPENAI_BASE_URL}
      OPENAI_COMPATIBLE_API_KEY: ${KBP_OPENAI_API_KEY}
      OPENAI_COMPATIBLE_MODEL: ${KBP_LLM_MODEL:-qwen/qwen3.5-122b-a10b}
      # openrouter 로 되돌릴 때 대비 — 위 openai 경로에서는 미사용.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HOST: 0.0.0.0
      PORT: "8081"
      EDGEQUAKE_DEFAULT_LLM_MODEL: ${KBP_LLM_MODEL:-qwen/qwen3.5-122b-a10b}
      EDGEQUAKE_LLM_MODEL: ${KBP_LLM_MODEL:-qwen/qwen3.5-122b-a10b}
      # reasoning(thinking) 끄기. 켜져 있으면 thinking 토큰이 max_tokens 를 잠식해
      # JSON 이 절단되고 추출이 조용히 무효화된다. 모델에 따라 달라 env 로 뺀다.
      EDGEQUAKE_LLM_DISABLE_REASONING: ${EDGEQUAKE_LLM_DISABLE_REASONING:-1}
      EDGEQUAKE_EXTRACTION_LANGUAGE: Korean
      EDGEQUAKE_EMBEDDING_PROVIDER: openai
      # ↓ 온프렘 임베딩 엔드포인트 (.env: LITELLM_EMBEDDING_BASE_URL)
      EDGEQUAKE_EMBEDDING_BASE_URL: ${LITELLM_EMBEDDING_BASE_URL}
      EDGEQUAKE_EMBEDDING_API_KEY: ${LITELLM_EMBEDDING_API_KEY}
      EDGEQUAKE_EMBEDDING_MODEL: ${EDGEQUAKE_EMBEDDING_MODEL:-bge-m3}
      # ↓ 온프렘 리랭커 엔드포인트 (.env: EDGEQUAKE_RERANK_*)
      EDGEQUAKE_RERANK_BASE_URL: ${EDGEQUAKE_RERANK_BASE_URL}
      EDGEQUAKE_RERANK_MODEL: ${EDGEQUAKE_RERANK_MODEL}
      EDGEQUAKE_RERANK_API_KEY: ${EDGEQUAKE_RERANK_API_KEY}
      # 리랭크 점수 하드컷. 0.0 = 재정렬만 하고 버리지 않음. **튜닝 노브라 리터럴로
      # 박으면 안 된다** — 과거 0.1 하드필터가 정답을 잘라 "이사"→"거주지 이전시" 검색이
      # 실패했다(그때 env 화한 값인데 airgap compose 에는 리터럴로 남아 있었다).
      EDGEQUAKE_MIN_RERANK_SCORE: ${EDGEQUAKE_MIN_RERANK_SCORE:-0.0}
      EDGEQUAKE_EMBEDDING_DIMENSION: "1024"
      RUST_LOG: ${EQ_RUST_LOG:-info}
      PDFIUM_AUTO_CACHE_DIR: /tmp/eqkbp-pdfium
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["3001:8081"]   # 외부노출: 호스트 3001 → edgequake API 8081(webui 그래프 데이터 소스)
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  # ── 문서처리 티어 ───────────────────────────────────────────────────────────
  doc_guard:
    image: kbp-doc_guard:airgap
    restart: unless-stopped
    networks: [kbp]
    # 외부노출 없음 — facade 가 게이트를 은닉한다(/gate/check-excel, /gate/rules).
    # 소비자는 facade(:3000)만 부른다. 직접 노출하면 인증 없는 게이트가 밖에 열린다.
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  adaptive_chunk:
    image: kbp-adaptive_chunk:airgap
    restart: unless-stopped
    environment:
      # ↓ 온프렘 LLM (.env: ADAPTIVE_CHUNK_OPENROUTER_*)
      ADAPTIVE_CHUNK_OPENROUTER_API_KEY: ${ADAPTIVE_CHUNK_OPENROUTER_API_KEY}
      ADAPTIVE_CHUNK_OPENROUTER_BASE_URL: ${ADAPTIVE_CHUNK_OPENROUTER_BASE_URL}
      # ↓ 온프렘 임베딩 (.env: ADAPTIVE_CHUNK_SCORING_EMBEDDING_*)
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_MODEL: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_MODEL}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_BASE_URL: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_BASE_URL}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_API_KEY: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_API_KEY}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_TIMEOUT_S: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_TIMEOUT_S:-600}
      ADAPTIVE_CHUNK_REGEX_LLM_MODEL: ${ADAPTIVE_CHUNK_REGEX_LLM_MODEL}
      ADAPTIVE_CHUNK_EDGEQUAKE_BASE_URL: ${ADAPTIVE_CHUNK_EDGEQUAKE_BASE_URL:-http://edgequake:8081}
      ADAPTIVE_CHUNK_JOB_TIMEOUT_S: ${ADAPTIVE_CHUNK_JOB_TIMEOUT_S:-3600}
      # ↓ 온프렘 리랭커 (.env: ADAPTIVE_CHUNK_RERANK_*)
      ADAPTIVE_CHUNK_RERANK_MODEL: ${ADAPTIVE_CHUNK_RERANK_MODEL}
      ADAPTIVE_CHUNK_RERANK_BASE_URL: ${ADAPTIVE_CHUNK_RERANK_BASE_URL}
      ADAPTIVE_CHUNK_RERANK_API_KEY: ${ADAPTIVE_CHUNK_RERANK_API_KEY}
      ADAPTIVE_CHUNK_COREF_LLM_MODEL: ${ADAPTIVE_CHUNK_COREF_LLM_MODEL}
      ADAPTIVE_CHUNK_COREF_REASONING: ${ADAPTIVE_CHUNK_COREF_REASONING:-off}
      ADAPTIVE_CHUNK_COREF_MAX_TOKENS: ${ADAPTIVE_CHUNK_COREF_MAX_TOKENS:-2000}
    ports: ["18060:18060"]
    networks: [kbp]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:18060/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── KB-pipeline 앱 티어 ─────────────────────────────────────────────────────
  parse-svc:
    image: kbp-parse-svc:airgap
    restart: unless-stopped
    environment:
      # ↓ 온프렘 LLM (.env: KBP_OPENAI_*)
      KBP_OPENAI_API_KEY: ${KBP_OPENAI_API_KEY}
      KBP_OPENAI_BASE_URL: ${KBP_OPENAI_BASE_URL}
      KBP_LLM_MODEL: ${KBP_LLM_MODEL}
      # ↓ 온프렘 VL-OCR (.env: MODEL_API_URL / MODEL_API_KEY)
      MODEL_API_URL: ${MODEL_API_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      KBP_FILECONVERT_URL: ${KBP_FILECONVERT_URL}
      KBP_FILECONVERT_TOKEN: ${KBP_FILECONVERT_TOKEN}
      KBP_FILECONVERT_TIMEOUT: ${KBP_FILECONVERT_TIMEOUT:-300}
      # 레거시 .xls → .xlsx (LibreOffice). 실측 239KB=38s(맥)/18s(컨테이너).
      KBP_XLS_CONVERT_TIMEOUT: ${KBP_XLS_CONVERT_TIMEOUT:-120}
      KBP_FILECONVERT_CRT_ID: ${KBP_FILECONVERT_CRT_ID:-kb-pipeline}
      # DRM 해제(docs/REFERENCE_DRM해제_API.md) — 토큰은 별도 변수(값은 우선 동일).
      KBP_DRM_URL: ${KBP_DRM_URL}
      KBP_DRM_TOKEN: ${KBP_DRM_TOKEN}
      KBP_DRM_TIMEOUT: ${KBP_DRM_TIMEOUT:-300}
      # PDF 트리아제 임계치/레인 선택(고도화 준비, 2026-08-06) — 기본값 = 기존 하드코딩 값(회귀 0).
      KBP_TRIAGE_MIXED_IMAGE_COV: ${KBP_TRIAGE_MIXED_IMAGE_COV:-0.25}
      KBP_TRIAGE_CONTENT_MIN: ${KBP_TRIAGE_CONTENT_MIN:-300}
      KBP_TRIAGE_DIAGRAM_CURVE_MIN: ${KBP_TRIAGE_DIAGRAM_CURVE_MIN:-30}
      KBP_TRIAGE_DIAGRAM_LINE_MIN: ${KBP_TRIAGE_DIAGRAM_LINE_MIN:-100}
      KBP_TRIAGE_DIAGRAM_IMG_COUNT: ${KBP_TRIAGE_DIAGRAM_IMG_COUNT:-5}
      KBP_TRIAGE_DIAGRAM_COMBO_CURVE_MIN: ${KBP_TRIAGE_DIAGRAM_COMBO_CURVE_MIN:-10}
      KBP_TRIAGE_NATIVE_TEXT_MIN_CHARS: ${KBP_TRIAGE_NATIVE_TEXT_MIN_CHARS:-20}
      KBP_TRIAGE_LANDSCAPE_TO_LLM: ${KBP_TRIAGE_LANDSCAPE_TO_LLM:-1}
      # ⚠️ 무효(2026-08-12) — 페이지수준 라우팅으로 소비자 소멸. 삭제는 Phase 4.
      KBP_GATE_VL_RATIO: ${KBP_GATE_VL_RATIO:-0.5}
      KBP_GATE_VL_LANE: ${KBP_GATE_VL_LANE:-vl}
      KBP_GATE_OCR_LANE: ${KBP_GATE_OCR_LANE:-paddle_gw}
      # paddle_gw 페이지 게이트(2026-08-11). **`:?` 금지** — verify-bundle.sh 가 `:?` 를
      # 자동으로 필수키로 파생하므로, 선택값에 쓰면 기존 현장 .env 가 전부 빨간 줄이 된다.
      KBP_GW_GATE: ${KBP_GW_GATE:-1}
      KBP_GW_MIN_CHARS: ${KBP_GW_MIN_CHARS:-50}
      KBP_GW_BLANK_INK_MAX: ${KBP_GW_BLANK_INK_MAX:-0.05}
      KBP_GW_CJK_MIN: ${KBP_GW_CJK_MIN:-30}
      KBP_GW_CJK_RATIO: ${KBP_GW_CJK_RATIO:-0.50}
      KBP_GW_CJK_DOC_RATIO: ${KBP_GW_CJK_DOC_RATIO:-0.30}
      KBP_GW_CJK_DOC_MIN_PAGES: ${KBP_GW_CJK_DOC_MIN_PAGES:-3}
      KBP_GW_DEGEN_SURVIVE_RATIO: ${KBP_GW_DEGEN_SURVIVE_RATIO:-0.5}
      KBP_GW_DEGEN_MIN_CHARS: ${KBP_GW_DEGEN_MIN_CHARS:-500}
      KBP_DEGEN_COMPRESS_MAX: ${KBP_DEGEN_COMPRESS_MAX:-0.16}
      KBP_DEGEN_SOFT_RULES: ${KBP_DEGEN_SOFT_RULES:-R3,R4}
      # ── 스캔 PDF OCR 게이트웨이(paddle_gw 레인) ────────────────────────────
      # ⚠️ 위 KBP_GATE_OCR_LANE 이 paddle_gw 인데 이 URL 이 비어 있으면, 스캔 문서가
      # paddle_gw 로 보내진 뒤 "KBP_PADDLE_OCR_GATEWAY_URL 미설정" RuntimeError 로
      # 실패하고 **조용히 ODL/VL 로 폴백**한다(비치명 처리라 에러가 겉으로 안 보인다).
      # 파싱은 되지만 의도한 스캔 레인은 한 번도 동작하지 않는다 — 폐쇄망에서는
      # 사내 PaddleOCR-VL 게이트웨이 주소를 반드시 넣어야 한다.
      # 게이트웨이를 안 쓸 거면 KBP_GATE_OCR_LANE 을 odl 또는 vl 로 바꾼다.
      KBP_PADDLE_OCR_GATEWAY_URL: ${KBP_PADDLE_OCR_GATEWAY_URL:-}
      KBP_PADDLE_GW_LANG: ${KBP_PADDLE_GW_LANG:-korean}
      KBP_PADDLE_GW_DPI: ${KBP_PADDLE_GW_DPI:-150}
      KBP_PADDLE_GW_TIMEOUT: ${KBP_PADDLE_GW_TIMEOUT:-600}
      KBP_PADDLE_GW_HTTP_TIMEOUT: ${KBP_PADDLE_GW_HTTP_TIMEOUT:-60}
      KBP_PADDLE_GW_POLL_INTERVAL: ${KBP_PADDLE_GW_POLL_INTERVAL:-5}
      # ⚠️ 무효(2026-08-12) — 페이지수준 라우팅으로 소비자 소멸. 삭제는 Phase 4.
      KBP_GATE_DEFAULT_LANE: ${KBP_GATE_DEFAULT_LANE:-odl}
      KBP_TRIAGE_LOG_TABLE: ${KBP_TRIAGE_LOG_TABLE:-1}
      # PAGE_HYBRID 순서도 조항 오버라이드(선택, 빈 문자열이면 코드 기본값 사용).
      KBP_PAGE_HYBRID_DIAGRAM_RULE: ${KBP_PAGE_HYBRID_DIAGRAM_RULE:-}
      # VL 계층구조(헤딩#/병합셀/도형 상하위) 규칙 오버라이드(선택, 빈 값이면 코드 기본값).
      KBP_PROMPT_HIERARCHY_RULE: ${KBP_PROMPT_HIERARCHY_RULE:-}
      # 구조화출력 방식. 사내 서빙 스택(vLLM/TGI/litellm)마다 지원 형태가 달라
      # response_format 을 못 받는 게이트웨이가 있다. 리터럴이면 교체 수단이 없다.
      GUIDED_JSON_MODE: ${GUIDED_JSON_MODE:-response_format}
      # VL/paddle_gw 공용 페이지 동시성(paddle_gw.py:143 이 이 값을 읽는다).
      # 리터럴로 박아두면 .env 에 적어도 무시된다 — 실제로 그런 상태였다(2026-08-09).
      KBP_VL_MAX_CONCURRENT: ${KBP_VL_MAX_CONCURRENT:-8}
      # ⚠️ 빈 값이면 미설정과 정반대(reasoning 켬) — 기본을 1 로 못박는다(vl_api.py).
      KBP_VL_DISABLE_REASONING: ${KBP_VL_DISABLE_REASONING:-1}
      # ── VL 모델·토큰 (Plan A). 온프렘 서빙 모델명을 .env 에 넣는다.
      MODEL_NAME: ${MODEL_NAME:?온프렘 서빙 모델명을 .env 에 지정하세요}
      VL_MAX_TOKENS: ${VL_MAX_TOKENS:-8000}
      KBP_VL_PAGE_MAX_TOKENS: ${KBP_VL_PAGE_MAX_TOKENS:-8000}
      # VL 실패 정책(Phase 2b-2) — KBP_FAIL_ON_EMPTY_PAGE 는 탈출구
      # 절단(A형)만 파생으로 +1회 더 받는다(기본 2 → 3)
      KBP_VL_PAGE_ATTEMPTS: ${KBP_VL_PAGE_ATTEMPTS:-2}
      KBP_VL_DOC_BUDGET_S: ${KBP_VL_DOC_BUDGET_S:-3600}
      KBP_FAIL_ON_EMPTY_PAGE: ${KBP_FAIL_ON_EMPTY_PAGE:-1}
      KBP_VL_PAGE_DPI: ${KBP_VL_PAGE_DPI:-200}
      KBP_VL_VISUAL_MIN_AREA: ${KBP_VL_VISUAL_MIN_AREA:-0.05}
      # OpenRouter 전용 필드라 폐쇄망에서는 무의미하다. 끄기는 `none` 센티널로 명시한다 —
      # 키를 빼면 코드 기본값(DeepInfra)이 발동해 온프렘 서버로 provider.ignore 가 전송된다.
      # (빈 문자열도 코드상 끄기지만 `none` 이 sync/호스트 경로까지 안전하다.)
      KBP_VL_BLOCK_PROVIDERS: "none"
      # MinIO — 내부 스택 통신용(바꾸지 말 것). 외부 MinIO 전환 시에만 .env 로 조정.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-document-parser}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    depends_on:
      minio: { condition: service_healthy }
    # 외부노출(OCR/파싱 엔진): **내부=외부 19001** (P1 2026-08-10, 이전 18081).
    # ⚠️ 18081 을 비운 이유: `.env.airgap.example` 의 KBP_PADDLE_OCR_GATEWAY_URL 이
    #    같은 호스트 18081 을 쓴다. 둘이 겹쳐 나중에 바인드하는 쪽이 실패하고 OCR 요청이
    #    parse-svc 로 가는 사고가 있었다(현장 "18081 ALREADY PORT"). 18081 은 OCR
    #    게이트웨이 단독 소유로 남긴다.
    ports: ["19001:19001"]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:19001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  facade:
    image: kbp-facade:airgap
    restart: unless-stopped
    environment: *facade_env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      parse-svc: { condition: service_healthy }
      adaptive_chunk: { condition: service_healthy }
      edgequake: { condition: service_healthy }
    ports: ["3000:19000"]   # 외부노출: 호스트 3000 → facade 19000(컨테이너 유지, 내부호출 무영향)
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:19000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  # ── facade-worker — 잡 큐 소비자 (이미지 추가 없음) ─────────────────────────
  # facade 와 **같은 이미지**(kbp-facade:airgap)를 명령만 바꿔 쓴다. 번들 이미지 목록은
  # 그대로 9종이다. HTTP 포트가 없어 health 폴링 대상이 아니다 — 살아있는지는
  # `GET /jobs/workers` 의 online 으로 본다.
  #
  # podman-compose 는 depends_on 조건을 기다리지 않는다(docs/airgap-deploy.md:126).
  # 그래서 ensure_schema 의 재시도 예산(≥120s)과 restart 정책이 유일한 방어다.
  facade-worker:
    image: kbp-facade:airgap
    command: ["python", "-m", "service.worker"]
    restart: unless-stopped
    stop_grace_period: 1800s
    environment: *facade_env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      parse-svc: { condition: service_healthy }
      adaptive_chunk: { condition: service_healthy }
      edgequake: { condition: service_healthy }
    networks: [kbp]

  # ── 그래프 적재 확인용 WebUI (선택 서비스) ──────────────────────────────────
  edgequake_webui:
    image: kbp-edgequake_webui:airgap
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 브라우저가 edgequake API 에 닿는 URL(컨테이너 DNS 아님). edgequake API 호스트포트가
      # 3001 로 바뀌었으므로 이 값도 3001 이어야 한다. 원격 접속 시 서버 IP 로:
      #   EDGEQUAKE_WEBUI_API_URL=http://<서버IP>:3001   (kbp .env 에 설정)
      # 미설정 시 로컬 기본값(localhost:3001) — 원격에선 그래프가 비니 반드시 서버IP로.
      EDGEQUAKE_API_URL: ${EDGEQUAKE_WEBUI_API_URL:-http://localhost:3001}
    depends_on:
      edgequake: { condition: service_healthy }
    ports: ["3002:3000"]   # 외부노출: 호스트 3002 → webui 3000(그래프 UI)
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:3000"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks: [kbp]
