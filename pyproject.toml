[project]
name = "kb-pipeline"
version = "0.1.0"
description = "Front-end stages (W0 Blockify, W2 Modal enrichment) of the KB pipeline."
requires-python = ">=3.9"
dependencies = [
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # W3 community-report pipeline
    "networkx>=3.0",
    "python-louvain>=0.16",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb_pipeline*"]

[tool.pytest.ini_options]
# service/tests 는 facade(잡 큐 포함) 테스트. 기본 수집 대상에 넣어 `pytest` 한 번으로
# 회귀가 잡히게 한다 — 잡 큐 도입 전에는 명시 경로로만 돌아 누락되기 쉬웠다.
testpaths = ["tests", "service/tests"]
markers = [
    "requires_pg: 실 Postgres(KBP_PG_DSN)가 필요한 테스트. DSN 미설정 시 skip.",
]
