# 8.kb-pipeline/docker-compose.yml
# Unified engine stack — Tasks 0-7 Dockerfiles wired together.
# Secrets stay in .env (gitignored). See .env.example for the full key catalog.
name: kbp
networks: { kbp: {} }
volumes: { eq_pg_data: {}, minio_data: {} }

# facade 와 facade-worker 는 **같은 이미지·같은 env** 로 돈다(명령만 다르다). 잡 큐가
# postgres 를, staging 이 MinIO 를 쓰므로 둘 다 여기 들어간다.
x-facade-env: &facade_env
  KBP_PARSE_SVC_URL: http://parse-svc:19001
  KBP_ADAPTIVE_CHUNK_URL: http://adaptive_chunk:18060
  KBP_EDGEQUAKE_URL: http://edgequake:8081
  # doc_guard — facade 가 게이트를 은닉한다(/gate/*). 소비자(kb)는 이 주소를 모른다.
  KBP_DOC_GUARD_URL: http://doc_guard:8000
  # 공유비밀(X-Facade-Key). **비어 있으면 게이트가 꺼진다**(dev 와 동일) — 폐쇄망은
  # facade 가 호스트 포트로 노출되므로 반드시 채운다. kb 스택의 KBP_FACADE_KEY 와
  # 같은 값이어야 적재·검색이 통과한다. 배포 전 검증은 verify-bundle.sh 가 막는다.
  KBP_FACADE_KEY: ${KBP_FACADE_KEY:-}
  # kb 가 남긴 `parse-staging/` 임시본 수거(D20). 잡 큐 GC 와 프리픽스도 판정도 다르다 —
  # 참조가 kb DB 에 있어 facade 는 나이로만 지운다. 0 이면 그 갈래 정지.
  #   preview  : 파싱 미리보기 세션(적재 누르기 전). 짧게.
  #   batch    : 배치 원본. 실패 항목 **재수행**이 이 객체를 다시 쓰므로 길게.
  KBP_STAGING_TTL_SECONDS: ${KBP_STAGING_TTL_SECONDS:-3600}
  KBP_STAGING_BATCH_TTL_SECONDS: ${KBP_STAGING_BATCH_TTL_SECONDS:-604800}
  KBP_PG_DSN: postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
  KBP_OPENAI_API_KEY: ${KBP_OPENAI_API_KEY}
  KBP_OPENAI_BASE_URL: ${KBP_OPENAI_BASE_URL}
  KBP_LLM_MODEL: ${KBP_LLM_MODEL}
  # 잡 staging + 큰 payload/result 오프로딩. 없으면 /parse·/ingest 접수가 전면 실패한다.
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-document-parser}
  MINIO_SECURE: "false"
  # 잡 큐 — 전부 ${VAR:-기본값} 형식이어야 한다. 기본값 없이 쓰면 미정의 시 빈 문자열이
  # 주입되어 코드 기본값이 아니라 빈 값으로 동작한다(KBP_FACADE_KEY 로 이미 겪은 함정).
  KBP_JOB_LIMIT_PARSE: ${KBP_JOB_LIMIT_PARSE:-4}
  KBP_JOB_LIMIT_CHUNK: ${KBP_JOB_LIMIT_CHUNK:-2}
  KBP_JOB_LIMIT_INSERT: ${KBP_JOB_LIMIT_INSERT:-2}
  # 커뮤니티 재빌드. 전역 단일 그래프라 1 이면 충분하다 — 같은 workspace 를 두 번
  # 빌드하면 뒤엣것이 앞엣것을 덮을 뿐이다.
  KBP_JOB_LIMIT_COMMUNITY: ${KBP_JOB_LIMIT_COMMUNITY:-1}
  KBP_JOB_LIMIT_PER_WORKSPACE: ${KBP_JOB_LIMIT_PER_WORKSPACE:-2}
  KBP_JOB_WORKER_CONCURRENCY: ${KBP_JOB_WORKER_CONCURRENCY:-4}
  KBP_JOB_MAX_WAITERS: ${KBP_JOB_MAX_WAITERS:-4}
  KBP_JOB_LEGACY_WAIT_SECONDS: ${KBP_JOB_LEGACY_WAIT_SECONDS:-3300}
  KBP_JOB_MAX_UPLOAD_BYTES: ${KBP_JOB_MAX_UPLOAD_BYTES:-52428800}
  KBP_JOB_MINIO_PREFIX: ${KBP_JOB_MINIO_PREFIX:-kbp-jobs}
  KBP_STAGING_PREFIX: ${KBP_STAGING_PREFIX:-parse-staging}
  # GC(D2) — TTL_HOURS=0 이면 TTL 삭제·고아 스윕이 **둘 다 정지**한다(비상 레버).
  KBP_JOB_TTL_HOURS: ${KBP_JOB_TTL_HOURS:-72}
  KBP_JOB_GC_INTERVAL_SECONDS: ${KBP_JOB_GC_INTERVAL_SECONDS:-3600}
  KBP_JOB_ORPHAN_SWEEP_INTERVAL_SECONDS: ${KBP_JOB_ORPHAN_SWEEP_INTERVAL_SECONDS:-21600}
  KBP_JOB_ORPHAN_SWEEP_BOOT_DELAY_SECONDS: ${KBP_JOB_ORPHAN_SWEEP_BOOT_DELAY_SECONDS:-600}
  KBP_JOB_ORPHAN_GRACE_SECONDS: ${KBP_JOB_ORPHAN_GRACE_SECONDS:-21600}

  # ── global 검색 (B) ──────────────────────────────────────────────────────
  # 커뮤니티 리포트 map N + reduce 1 의 **순차 LLM** 이라 요청 하나가 분 단위로 스레드를
  # 점유한다. 잡 큐의 상한은 잡 경로에만 적용되므로 이 동기 경로에는 별도 상한이 필요하다.
  # map 대상 수를 줄이려면 요청의 global_top_k(1~5 clamp)를 쓴다 — facade 의 top_k 와 다르다.
  KBP_GLOBAL_LLM_TIMEOUT: ${KBP_GLOBAL_LLM_TIMEOUT:-60}
  # **워커 4개를 합친 시스템 전역** 상한(DB 카운터 + advisory lock). 0 이면 사실상 비활성.
  KBP_GLOBAL_SEARCH_CONCURRENCY: ${KBP_GLOBAL_SEARCH_CONCURRENCY:-2}

  # ── 야간 커뮤니티 배치(A1) ────────────────────────────────────────────────
  # 커뮤니티 빌드를 적재 경로에서 떼어내 **밤 1회**로 모은다(주간 LLM 부하 회피 +
  # 진입점 단일화). 대가는 "커뮤니티가 최대 하루 뒤 반영"이다.
  # 야간 창을 판정할 시간대. **컨테이너 TZ 와 분리했다**(D33) — 한 변수가 "창 판정"과
  # "로그 시각 표기"를 겸하면, 로그를 UTC 로 맞추려 TZ=UTC 로 둘 때 창이 조용히 KST
  # 정오로 이동한다. 컨테이너는 UTC 로 두어 parse-svc 와 로그 시각축을 통일하고,
  # 창 판정만 이 값으로 한다. 미설정 기본값이 Asia/Seoul 이라 안 줘도 정확하다.
  KBP_COMMUNITY_TZ: ${KBP_COMMUNITY_TZ:-Asia/Seoul}
  # false 면 스레드를 아예 안 띄운다(파서 전용 배포·비상 정지).
  KBP_COMMUNITY_BUILD_ENABLED: ${KBP_COMMUNITY_BUILD_ENABLED:-true}
  KBP_COMMUNITY_BUILD_AT: ${KBP_COMMUNITY_BUILD_AT:-03:00}
  KBP_COMMUNITY_WINDOW_MINUTES: ${KBP_COMMUNITY_WINDOW_MINUTES:-120}
  # 이 시각 이후에는 남은 queued 를 취소한다(업무시간 침범 방지). 창보다 커야 의미가 있다.
  KBP_COMMUNITY_DEADLINE_MINUTES: ${KBP_COMMUNITY_DEADLINE_MINUTES:-420}
  KBP_COMMUNITY_MAX_PER_NIGHT: ${KBP_COMMUNITY_MAX_PER_NIGHT:-8}
  KBP_COMMUNITY_POLL_SECONDS: ${KBP_COMMUNITY_POLL_SECONDS:-60}
  # SIGKILL/OOM 으로 batch_runs 행이 'started' 로 굳었을 때 회수하기까지의 지연(분).
  KBP_COMMUNITY_STALE_RUN_MINUTES: ${KBP_COMMUNITY_STALE_RUN_MINUTES:-30}
  # 제출 루프 시간 예산(초). ensure_workspace 가 동기 HTTP 라 edgequake 가 hang 이면
  # 캡만큼 곱해져 틱 하나가 오래 막힌다.
  KBP_COMMUNITY_SUBMIT_BUDGET_SECONDS: ${KBP_COMMUNITY_SUBMIT_BUDGET_SECONDS:-600}
services:
  # ---------------------------------------------------------------------------
  # Infrastructure tier
  # ---------------------------------------------------------------------------
  postgres:
    image: ghcr.io/raphaelmansuy/edgequake-postgres:latest
    environment:
      POSTGRES_USER: edgequake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgequake_secret}
      POSTGRES_DB: edgequake
    volumes: ["eq_pg_data:/var/lib/postgresql/data"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U edgequake"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kbp]

  # ┌─ 외부 MinIO 로 전환하려면(다른 곳에 이미 떠 있는 MinIO 재사용) ──────────────
  # │ ① 삭제: 아래 `minio:` 서비스 블록 전체 + 최상단 `volumes:` 의 `minio_data`
  # │        + docker-compose.override.yml 의 `minio` 호스트포트 리맵.
  # │ ② 수정: parse-svc 의 MINIO_ENDPOINT/ACCESS/SECRET/BUCKET/SECURE 를 외부 값으로,
  # │        그리고 parse-svc `depends_on:` 에서 `minio` 줄 제거(§ parse-svc 참고).
  # │ ③ 버킷: 외부 MinIO 에 `document-parser` 버킷을 미리 생성(기동매뉴얼 §4-5).
  # └────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: ["minio_data:/data"]
    ports: ["19010:9000","19011:9001"]
    healthcheck:
      # curl confirmed present in minio/minio
      test: ["CMD","curl","-fsS","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [kbp]

  # Phase 2e: redis/document-parser/excel-parser 제거 — 파싱은 parse-svc in-process 소유
  # (excel_parser_rag vendoring + VL OCR in-process). office→PDF 는 원격 변환 API(KBP_FILECONVERT_URL).

  # ---------------------------------------------------------------------------
  # Knowledge-graph / vector engine
  # ---------------------------------------------------------------------------
  edgequake:
    build: { context: ., dockerfile: docker/edgequake.Dockerfile }
    environment:
      DATABASE_URL: postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
      EDGEQUAKE_CHUNKER: passthrough
      # 기본은 openrouter(불변, 현재 dev 동작 그대로). 폐쇄망 실측(2026-08-07, 2단계):
      # 1) openrouter provider 는 base_url 오버라이드가 없어 인터넷 없는 환경에서 100%
      #    실패(하드코딩 https://openrouter.ai).
      # 2) EDGEQUAKE_LLM_PROVIDER=openai 로 바꿔도 safety_limits.rs 의 COMPAT-GUARD 가
      #    "openai" provider + 비-gpt-* 모델명(예: qwen/...)을 감지해 조용히
      #    gpt-4.1-nano/api.openai.com 으로 되돌린다(openai/anthropic/gemini/xai/minimax
      #    전용 가드, openai-compatible/openrouter 는 대상 아님 — 코드 확인).
      # → 폐쇄망은 EDGEQUAKE_LLM_PROVIDER=openai-compatible + OPENAI_COMPATIBLE_*
      #   (docker-compose.airgap.yml 기본값)를 쓴다. openrouter 기본값에서는 아래 변수들
      #   미사용(inert).
      EDGEQUAKE_LLM_PROVIDER: ${EDGEQUAKE_LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_COMPATIBLE_BASE_URL: ${KBP_OPENAI_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${KBP_OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${KBP_LLM_MODEL:-}
      # HOST/PORT (not EDGEQUAKE_HOST/EDGEQUAKE_PORT) — edgequake main.rs reads these
      HOST: 0.0.0.0
      PORT: "8081"
      EDGEQUAKE_DEFAULT_LLM_MODEL: qwen/qwen3.5-122b-a10b
      EDGEQUAKE_LLM_MODEL: qwen/qwen3.5-122b-a10b   # prevents COMPAT-GUARD downgrade bug
      EDGEQUAKE_LLM_DISABLE_REASONING: "1"   # qwen reasoning off(키워드추출 30-55s→수초, 2026-07-16)
      EDGEQUAKE_EXTRACTION_LANGUAGE: Korean   # 엔티티/관계 설명 한글 저장(미설정 시 영어 강제, 2026-07-16)
      EDGEQUAKE_EMBEDDING_PROVIDER: openai
      EDGEQUAKE_EMBEDDING_BASE_URL: ${LITELLM_EMBEDDING_BASE_URL}
      EDGEQUAKE_EMBEDDING_API_KEY: ${LITELLM_EMBEDDING_API_KEY}
      EDGEQUAKE_EMBEDDING_MODEL: bge-m3
      # 신경망 리랭커(BM25 동의어 컷 문제 해결, 2026-07-21) — 미설정 시 BM25 폴백
      EDGEQUAKE_RERANK_BASE_URL: ${EDGEQUAKE_RERANK_BASE_URL}
      EDGEQUAKE_RERANK_MODEL: ${EDGEQUAKE_RERANK_MODEL}
      EDGEQUAKE_RERANK_API_KEY: ${EDGEQUAKE_RERANK_API_KEY}
      # 리랭커는 필터가 아닌 재정렬만(2026-07-21) — 긴 다주제 청크의 정답이 0.1 컷에 탈락하던
      # 문제 해결. 후보는 다운스트림 토큰예산 truncation 이 캡하므로 0.0 으로 전부 유지.
      EDGEQUAKE_MIN_RERANK_SCORE: "0.0"
      EDGEQUAKE_EMBEDDING_DIMENSION: "1024"
      RUST_LOG: ${EQ_RUST_LOG:-info}
      PDFIUM_AUTO_CACHE_DIR: /tmp/eqkbp-pdfium
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  # ---------------------------------------------------------------------------
  # Document processing tier — Phase 2e: 파싱은 parse-svc in-process 소유.
  # (구 document-parser :18050 / excel-parser :18055 서비스 제거.)
  # ---------------------------------------------------------------------------
  doc_guard:
    # build context: one level up from 8.kb-pipeline/ (sibling repo)
    build: { context: ../99.projects/shinhan_trust/doc_guard }
    networks: [kbp]
    ports: ["8001:8000"]   # host:8001 → container:8000
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  adaptive_chunk:
    # build context: one level up from 8.kb-pipeline/ (sibling repo)
    build: { context: ../99.projects/adaptive_chunk }
    environment:
      # pydantic-settings env_prefix="ADAPTIVE_CHUNK_" — no env_file: to avoid leaking all secrets.
      # Each key is listed explicitly. See .env.example for guidance on container-internal URLs.
      ADAPTIVE_CHUNK_OPENROUTER_API_KEY: ${ADAPTIVE_CHUNK_OPENROUTER_API_KEY}
      ADAPTIVE_CHUNK_OPENROUTER_BASE_URL: ${ADAPTIVE_CHUNK_OPENROUTER_BASE_URL}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_MODEL: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_MODEL}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_BASE_URL: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_BASE_URL}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_API_KEY: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_API_KEY}
      ADAPTIVE_CHUNK_SCORING_EMBEDDING_TIMEOUT_S: ${ADAPTIVE_CHUNK_SCORING_EMBEDDING_TIMEOUT_S}
      ADAPTIVE_CHUNK_REGEX_LLM_MODEL: ${ADAPTIVE_CHUNK_REGEX_LLM_MODEL}
      # ADAPTIVE_CHUNK_OCR_BASE_URL 제거(Phase 2e, 리뷰 B4): adaptive 의 file-OCR 경로
      # (/chunk/jobs/file) 전용이었고 facade 는 text 경로(/chunk/jobs)만 사용 → document-parser
      # 제거와 함께 삭제. file-OCR 필요 시 별도 OCR 서비스 URL 지정.
      # ADAPTIVE_CHUNK_QDRANT_URL 제거(2026-07-01): 벡터 적재는 edgequake(pgvector) 소유,
      # adaptive_chunk 는 Qdrant 미소비(config placeholder). SoT.md §9 참조.
      ADAPTIVE_CHUNK_EDGEQUAKE_BASE_URL: ${ADAPTIVE_CHUNK_EDGEQUAKE_BASE_URL}
      ADAPTIVE_CHUNK_JOB_TIMEOUT_S: ${ADAPTIVE_CHUNK_JOB_TIMEOUT_S}
      ADAPTIVE_CHUNK_RERANK_MODEL: ${ADAPTIVE_CHUNK_RERANK_MODEL}
      ADAPTIVE_CHUNK_RERANK_BASE_URL: ${ADAPTIVE_CHUNK_RERANK_BASE_URL}
      ADAPTIVE_CHUNK_RERANK_API_KEY: ${ADAPTIVE_CHUNK_RERANK_API_KEY}
      ADAPTIVE_CHUNK_COREF_LLM_MODEL: ${ADAPTIVE_CHUNK_COREF_LLM_MODEL}
      ADAPTIVE_CHUNK_COREF_REASONING: ${ADAPTIVE_CHUNK_COREF_REASONING}
      # coref 폭주 안전망(2026-07-22) — 저성능 모델 JSON 무한반복 방지. compose 주입 필요.
      ADAPTIVE_CHUNK_COREF_MAX_TOKENS: ${ADAPTIVE_CHUNK_COREF_MAX_TOKENS:-2000}
    ports: ["18060:18060"]   # 호스트 facade(:18060) 접근용 (2026-07-20)
    networks: [kbp]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:18060/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # KB-pipeline application tier
  # ---------------------------------------------------------------------------
  # ⚠️ DEV-SHADOW 주의(2026-07-07): dev 는 parse-svc/facade 를 **호스트 프로세스**로 돌린다
  # (scripts/run-parse-svc.sh · run-facade.sh — 라이브 소스 반영). `docker compose up -d` 로
  # 이 컨테이너를 띄우면 **옛 이미지 코드**가 호스트 프로세스를 가려(facade→`parse-svc:19001`
  # 컨테이너 DNS) 소스 수정이 무시된다("옛날 파싱"). dev 에선 이 두 서비스를 docker 로 올리지
  # 말 것. 컨테이너로 갈 때만 `docker compose build parse-svc facade` 로 이미지 재빌드.
  parse-svc:
    build: { context: ., dockerfile: Dockerfile.parse-svc }
    environment:
      KBP_OPENAI_API_KEY: ${KBP_OPENAI_API_KEY}
      KBP_OPENAI_BASE_URL: ${KBP_OPENAI_BASE_URL}
      KBP_LLM_MODEL: ${KBP_LLM_MODEL}
      # Phase 2e: 파싱 in-process — excel_parser_rag(kordoc/openpyxl auto) + VL OCR.
      # EXCEL_PARSER_BACKEND 는 이미지 기본값 auto(Dockerfile.parse-svc) — override 없음.
      MODEL_API_URL: ${MODEL_API_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      KBP_FILECONVERT_URL: ${KBP_FILECONVERT_URL}
      KBP_FILECONVERT_TOKEN: ${KBP_FILECONVERT_TOKEN}
      KBP_FILECONVERT_TIMEOUT: ${KBP_FILECONVERT_TIMEOUT:-300}
      KBP_FILECONVERT_CRT_ID: ${KBP_FILECONVERT_CRT_ID:-kb-pipeline}
      # DRM 해제(docs/REFERENCE_DRM해제_API.md) — 토큰은 별도 변수(값은 우선 동일).
      KBP_DRM_URL: ${KBP_DRM_URL}
      KBP_DRM_TOKEN: ${KBP_DRM_TOKEN}
      KBP_DRM_TIMEOUT: ${KBP_DRM_TIMEOUT:-300}
      # PDF 트리아제 임계치/레인 선택(고도화 준비, 2026-08-06) — 기본값 = 기존 하드코딩 값(회귀 0).
      KBP_TRIAGE_MIXED_IMAGE_COV: ${KBP_TRIAGE_MIXED_IMAGE_COV:-0.25}
      KBP_TRIAGE_CONTENT_MIN: ${KBP_TRIAGE_CONTENT_MIN:-300}
      KBP_TRIAGE_DIAGRAM_CURVE_MIN: ${KBP_TRIAGE_DIAGRAM_CURVE_MIN:-30}
      KBP_TRIAGE_DIAGRAM_LINE_MIN: ${KBP_TRIAGE_DIAGRAM_LINE_MIN:-100}
      KBP_TRIAGE_DIAGRAM_IMG_COUNT: ${KBP_TRIAGE_DIAGRAM_IMG_COUNT:-5}
      KBP_TRIAGE_DIAGRAM_COMBO_CURVE_MIN: ${KBP_TRIAGE_DIAGRAM_COMBO_CURVE_MIN:-10}
      KBP_TRIAGE_NATIVE_TEXT_MIN_CHARS: ${KBP_TRIAGE_NATIVE_TEXT_MIN_CHARS:-20}
      KBP_TRIAGE_LANDSCAPE_TO_LLM: ${KBP_TRIAGE_LANDSCAPE_TO_LLM:-1}
      KBP_GATE_VL_RATIO: ${KBP_GATE_VL_RATIO:-0.5}
      KBP_GATE_VL_LANE: ${KBP_GATE_VL_LANE:-vl}
      KBP_GATE_OCR_LANE: ${KBP_GATE_OCR_LANE:-paddle_gw}
      KBP_GATE_DEFAULT_LANE: ${KBP_GATE_DEFAULT_LANE:-odl}
      KBP_TRIAGE_LOG_TABLE: ${KBP_TRIAGE_LOG_TABLE:-1}
      # PAGE_HYBRID 순서도 조항 오버라이드(선택, 빈 문자열이면 코드 기본값 사용).
      KBP_PAGE_HYBRID_DIAGRAM_RULE: ${KBP_PAGE_HYBRID_DIAGRAM_RULE:-}
      # VL 계층구조(헤딩#/병합셀/도형 상하위) 규칙 오버라이드(선택, 빈 값이면 코드 기본값).
      KBP_PROMPT_HIERARCHY_RULE: ${KBP_PROMPT_HIERARCHY_RULE:-}
      GUIDED_JSON_MODE: response_format   # OpenRouter/OpenAI 호환 (vLLM extra_body 아님)
      KBP_VL_MAX_CONCURRENT: "3"
      # ── VL 모델·토큰 (Plan A). 값 없이 키만 넣으면 빈 문자열이 "설정됨"이 되어
      #    코드 기본값이 무력화되고 model="" 로 VL 이 전량 실패한다 → 반드시 기본값 포함.
      MODEL_NAME: ${MODEL_NAME:-qwen/qwen3.5-122b-a10b}
      # 전면 VL(스캔 페이지 hybrid)은 본문·표·서술을 한 응답에 담아 기본 2000 에서 절단된다.
      VL_MAX_TOKENS: ${VL_MAX_TOKENS:-8000}
      KBP_VL_PAGE_MAX_TOKENS: ${KBP_VL_PAGE_MAX_TOKENS:-8000}
      # hybrid VL 입력 해상도 — 실측(R2~R7)이 전부 200dpi 라 그 값과 일치시킨다.
      KBP_VL_PAGE_DPI: ${KBP_VL_PAGE_DPI:-200}
      # image/figure/chart 가 페이지의 이 비율 이상일 때만 전면 VL. 실측 공백 0.55~5.06%.
      KBP_VL_VISUAL_MIN_AREA: ${KBP_VL_VISUAL_MIN_AREA:-0.05}
      # OpenRouter 가 이미지를 버리는 프로바이더로 라우팅하는 것 차단(개발환경 전용).
      # `:-` 아님 — 빈 문자열로 opt-out 할 수 있어야 한다.
      KBP_VL_BLOCK_PROVIDERS: ${KBP_VL_BLOCK_PROVIDERS-DeepInfra}
      # 스캔 PDF 레인(paddle_gw). scripts/parse-svc.env 에만 있어 컨테이너로 전달되지 않아
      # paddle_gw 레인이 "KBP_PADDLE_OCR_GATEWAY_URL 미설정" RuntimeError 로 계속 실패했다.
      KBP_PADDLE_OCR_GATEWAY_URL: ${KBP_PADDLE_OCR_GATEWAY_URL:-https://api-doc.ys-helperai.com/ocr/paddleocr_vl}
      # ── MinIO 접속(페이지 이미지 저장) ─────────────────────────────────────────
      # 외부 MinIO 로 전환 시: 아래 5개 값을 외부 엔드포인트/크레덴셜로 수정하고
      # (예: MINIO_ENDPOINT: minio.example.com:9000, MINIO_SECURE: "true"),
      # 위 `minio:` 서비스 블록을 삭제한 뒤 아래 depends_on 의 `minio` 줄도 제거한다.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-document-parser}
      MINIO_SECURE: "false"
    depends_on:
      minio: { condition: service_healthy }   # 외부 MinIO 전환 시 이 줄 제거
    ports: ["19001:19001"]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:19001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  # ⚠️ DEV-SHADOW 주의: parse-svc 와 동일 — dev 는 scripts/run-facade.sh(호스트) 사용.
  # `docker compose up` 로 이 컨테이너를 띄우면 옛 이미지가 호스트 facade 를 가린다(위 parse-svc 주석 참조).
  facade:
    build: { context: ., dockerfile: Dockerfile.facade }
    image: kbp-facade:dev          # facade-worker 가 같은 태그를 재사용한다
    environment: *facade_env
    # Phase 2e: facade 는 파싱 미수행 → KBP_EXCEL_URL/KBP_OCR_URL 제거(parse-svc 위임).
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      parse-svc: { condition: service_healthy }
      adaptive_chunk: { condition: service_healthy }
      edgequake: { condition: service_healthy }
    ports: ["19000:19000"]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:19000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [kbp]

  # ---------------------------------------------------------------------------
  # facade-worker — 잡 큐 소비자. 다운스트림 호출은 오직 여기 슬롯 안에서만 일어난다.
  # ---------------------------------------------------------------------------
  # facade 와 **같은 이미지**를 쓰고 command 만 다르다. build 를 빼면 compose 가
  # kbp-facade:dev 를 pull 하려다 실패한다(로컬 전용 태그라 레지스트리에 없다) —
  # build 금지는 airgap 파일에만 적용된다.
  #
  # HTTP 포트가 없다. 살아있는지는 `GET /jobs/workers` 의 online 으로 본다(worker
  # 레지스트리 heartbeat). worker 가 죽으면 facade 가 접수를 503 으로 거절한다.
  facade-worker:
    build: { context: ., dockerfile: Dockerfile.facade }
    image: kbp-facade:dev
    command: ["python", "-m", "service.worker"]
    environment: *facade_env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      parse-svc: { condition: service_healthy }
      adaptive_chunk: { condition: service_healthy }
      edgequake: { condition: service_healthy }
    restart: unless-stopped
    # 드레인 여유. 기본 10초면 SIGKILL 이라 진행 중 잡이 완주하지 못하고 stale 만료까지
    # 방치된다(설계 §6.1).
    stop_grace_period: 1800s
    networks: [kbp]

  # ---------------------------------------------------------------------------
  # edgequake WebUI — 그래프 적재 확인용 (선택 서비스)
  # ---------------------------------------------------------------------------
  # edgequake 에 적재된 지식그래프(엔티티/관계)·워크스페이스·문서를 브라우저로 조회·
  # 시각화·질의하기 위한 확인용 UI. http://localhost:3000.
  # ※ 운영 적재 경로가 아님: 문서 적재는 facade `/ingest`(parse-svc 파싱 + adaptive
  #    청킹 + 모달원자성)로 한다. 이 UI 로 직접 업로드하면 kb-pipeline 경로를 우회하므로
  #    "적재 결과(그래프) 확인/디버깅" 용도로만 쓴다.
  edgequake_webui:
    build:
      # 컨텍스트는 edgequake 서브모듈 루트(webui Dockerfile 이 edgequake_webui/* 를 COPY).
      context: ./edgequake
      dockerfile: edgequake_webui/Dockerfile
    environment:
      NODE_ENV: production
      # EDGEQUAKE_API_URL 은 **브라우저**가 API 에 닿는 URL(요청시각에 window 런타임설정으로
      # 주입) — 컨테이너 DNS(http://edgequake:8081)가 아니라 호스트 매핑 포트를 쓴다.
      EDGEQUAKE_API_URL: ${EDGEQUAKE_WEBUI_API_URL:-http://localhost:8081}
    depends_on:
      edgequake: { condition: service_healthy }
    ports: ["3000:3000"]   # 호스트 3000 충돌 시 docker-compose.override.yml 에서 리맵
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://localhost:3000"]
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks: [kbp]
